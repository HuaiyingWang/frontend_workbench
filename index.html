  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">F/</span>
        <span class="brand-name">前端工作台</span>
      </div>

      <nav class="primary-nav" aria-label="主要導覽">
        <p class="nav-label">工作空間</p>
        <button class="nav-item is-active" data-route="dashboard"><svg><use href="#i-grid"/></svg><span>首頁</span></button>
        <button class="nav-item" data-route="projects"><svg><use href="#i-folder"/></svg><span>專案</span><span class="nav-count" id="projectCount">06</span></button>
        <button class="nav-item" data-route="inbox"><svg><use href="#i-inbox"/></svg><span>修改收件匣</span><span class="nav-count is-alert" id="inboxCount">04</span></button>

        <p class="nav-label">資源</p>
        <button class="nav-item" data-route="assets"><svg><use href="#i-image"/></svg><span>素材庫</span></button>
        <button class="nav-item" data-route="packages"><svg><use href="#i-package"/></svg><span>套件庫</span></button>
        <button class="nav-item" data-route="prompts"><svg><use href="#i-spark"/></svg><span>提示詞庫</span></button>
      </nav>

      <div class="sidebar-foot">
        <div class="storage-line"><span>網站收藏</span><strong id="websiteCount">8 / 50</strong></div>
        <div class="storage-track"><span></span></div>
        <button class="profile-button" data-route="settings" aria-label="開啟同步與個人設定">
          <span class="avatar">YK</span>
          <span><strong>我的工作區</strong><small id="profileSyncState">尚未連線</small></span>
          <svg><use href="#i-more"/></svg>
        </button>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobileMenu" aria-label="開啟導覽" aria-controls="sidebar" aria-expanded="false"><svg><use href="#i-menu"/></svg></button>
        <button class="command-trigger" id="commandTrigger">
          <svg><use href="#i-search"/></svg>
          <span>搜尋專案、素材、套件或提示詞...</span>
          <kbd>Ctrl K</kbd>
        </button>
        <div class="top-actions">
          <button class="quiet-button" data-action="capture" aria-label="記一筆修改"><svg><use href="#i-inbox"/></svg><span>記一筆修改</span></button>
          <button class="primary-button" data-action="new-project" aria-label="建立專案"><svg><use href="#i-plus"/></svg><span>建立專案</span></button>
        </div>
      </header>

      <main id="mainContent" tabindex="-1"></main>

      <nav class="mobile-nav" aria-label="行動版導覽">
        <button class="is-active" data-route="dashboard"><svg><use href="#i-grid"/></svg><span>首頁</span></button>
        <button data-route="projects"><svg><use href="#i-folder"/></svg><span>專案</span></button>
        <button class="mobile-create" data-action="capture"><svg><use href="#i-plus"/></svg><span>新增</span></button>
        <button data-route="assets"><svg><use href="#i-image"/></svg><span>素材</span></button>
        <button data-route="prompts"><svg><use href="#i-spark"/></svg><span>提示詞</span></button>
      </nav>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="drawerTitle" inert>
    <div class="drawer-head">
      <div><p class="drawer-context" id="drawerContext">快速建立</p><h2 id="drawerTitle">建立新專案</h2></div>
      <button class="icon-button" id="drawerClose" aria-label="關閉"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <dialog class="command-dialog" id="commandDialog">
    <form method="dialog" class="command-box">
      <div class="command-input-wrap">
        <svg><use href="#i-search"/></svg>
        <input id="commandInput" type="search" placeholder="輸入關鍵字或指令..." autocomplete="off" aria-label="搜尋指令">
        <button value="cancel" aria-label="關閉搜尋">Esc</button>
      </div>
      <div class="command-results" id="commandResults"></div>
      <footer><span><kbd>↑↓</kbd> 選擇</span><span><kbd>Enter</kbd> 開啟</span></footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=20260918-duplicate-project"></script>
</body>
</html>
